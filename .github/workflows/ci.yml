name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.17.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm test
      - name: Validate Codex manifests and npm contents
        run: npm run validate:package

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swiftc version
        run: swiftc --version
      - name: Build macOS lease helper
        run: swiftc -O src/macos-keep-awake.swift -o /tmp/macos-keep-awake
      - name: Verify binary is arm64 Mach-O
        run: file /tmp/macos-keep-awake | grep -E "Mach-O .* (arm64|x86_64)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows lease helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "src/windows-keep-awake.ps1",
            [ref] $tokens,
            [ref] $errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output $_.Message }
            exit 1
          }
